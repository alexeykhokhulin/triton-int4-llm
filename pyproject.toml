[tool.poetry]
name = "triton-int4"
version = "0.1.0"
description = "Int4 quantization kernels and utilities"
authors = ["Alexey Khokhulin <alexei.khokhulin@gmail.com>"]
readme = "README.md"
packages = [{ include = "triton_int4" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "^2.1.2"
torch = "^2.4.1"
triton = "^3.1.0"
transformers = "^4.57.1"
datasets = "^4.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"

[tool.ruff]
line-length = 100

[[tool.poetry.source]]
name = "tcs-pypi"
priority = "primary"
url = "https://artifactory.tcsbank.ru/artifactory/api/pypi/python-all/simple"

[[tool.poetry.source]]
name = "pypi_internal"
priority = "supplemental"
url = "https://registry.tcsbank.ru/repository/pypi_internal/simple"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
